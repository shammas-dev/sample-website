<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-page="home">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vana Mist Resort | Luxury Nature Stays in Wayanad</title>
    <meta name="description" content="Book direct at Vana Mist Resort, Wayanad. Private villas and cottages with zero booking fees." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- STYLES (development mode: Tailwind CDN). For production run `npm run build:css`, then replace the
         next two <script> lines with:  <link rel="stylesheet" href="css/tailwind.css" /> -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Config + theme run here so colours are correct before first paint -->
    <script src="js/config.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/theme.js"></script>
</head>

<body class="bg-alabaster text-charcoal font-sans antialiased selection:bg-forest selection:text-alabaster">

    <div id="site-header" data-variant="overlay"></div>

    <main id="main">
    <!-- HERO + BOOKING DOCK -->
    <section class="relative min-h-[100svh] flex flex-col justify-between pt-28 pb-10 px-5 md:px-12 overflow-hidden">
        <div class="absolute inset-0 z-0 overflow-hidden">
            <img data-cfg-src="hero.image" data-w="2000" data-cfg-alt="hero.imageAlt" src="" alt="" fetchpriority="high" class="w-full h-full object-cover ken-burns" />
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/40 to-forest/95"></div>
        </div>

        <div class="relative z-10 max-w-4xl mx-auto text-center text-white my-auto pt-6 reveal">
            <div id="heroPill"></div>
            <h1 data-cfg="hero.headline" class="font-serif text-4xl sm:text-6xl md:text-7xl font-semibold leading-[1.08] tracking-tight mb-5 text-balance"></h1>
            <p data-cfg="hero.subtext" class="text-white/85 text-base md:text-lg max-w-2xl mx-auto font-normal leading-relaxed"></p>
        </div>

        <!-- SMART LIVE RATE & WHATSAPP BOOKING DOCK -->
        <div id="booking-dock" class="relative z-20 max-w-6xl w-full mx-auto mt-10 reveal">
            <div
                class="bg-white/95 backdrop-blur-xl rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-2xl border border-white/40">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3.5 lg:gap-4 items-end">

                    <!-- Check-in (2 cols on desktop) -->
                    <div class="lg:col-span-2">
                        <label for="checkin"
                            class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1.5">Check-in</label>
                        <input type="text" id="checkin" placeholder="Select date" readonly
                            class="w-full bg-sand/70 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-medium text-charcoal focus:outline-none focus:border-forest cursor-pointer" />
                    </div>

                    <!-- Check-out (2 cols on desktop) -->
                    <div class="lg:col-span-2">
                        <label for="checkout"
                            class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1.5">Check-out</label>
                        <input type="text" id="checkout" placeholder="Select date" readonly
                            class="w-full bg-sand/70 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-medium text-charcoal focus:outline-none focus:border-forest cursor-pointer" />
                    </div>

                    <!-- Room Type & Rate (3 cols on desktop) -->
                    <div class="sm:col-span-2 lg:col-span-3">
                        <label for="roomType"
                            class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1.5">Select
                            Stay</label>
                        <select id="roomType"
                            class="w-full bg-sand/70 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-semibold text-charcoal focus:outline-none focus:border-forest"></select>
                    </div>

                    <!-- Guests & Rooms Inline Stepper (3 cols on desktop) -->
                    <div class="sm:col-span-2 lg:col-span-3">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-500 mb-1.5">Guests
                            & Rooms</label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5">
                            <!-- Adults -->
                            <div
                                class="bg-sand/70 border border-gray-200 rounded-xl px-3 sm:px-1.5 py-1.5 flex flex-row sm:flex-col items-center justify-between sm:justify-center">
                                <span
                                    class="text-xs sm:text-[10px] font-bold uppercase tracking-wide text-gray-600 sm:mb-0.5">Adults</span>
                                <div class="flex items-center gap-2 lg:gap-1">
                                    <button type="button" onclick="updateCount('adults', -1)"
                                        aria-label="Decrease adults"
                                        class="w-10 h-10 sm:w-9 sm:h-9 lg:w-6 lg:h-6 rounded-lg bg-white border border-gray-200 text-forest font-bold text-base lg:text-xs flex items-center justify-center hover:bg-forest hover:text-white transition cursor-pointer">−</button>
                                    <span id="adultCount"
                                        class="w-6 lg:w-4 text-center text-base lg:text-xs font-bold text-charcoal tabular-nums">2</span>
                                    <button type="button" onclick="updateCount('adults', 1)"
                                        aria-label="Increase adults"
                                        class="w-10 h-10 sm:w-9 sm:h-9 lg:w-6 lg:h-6 rounded-lg bg-white border border-gray-200 text-forest font-bold text-base lg:text-xs flex items-center justify-center hover:bg-forest hover:text-white transition cursor-pointer">+</button>
                                </div>
                            </div>

                            <!-- Kids -->
                            <div
                                class="bg-sand/70 border border-gray-200 rounded-xl px-3 sm:px-1.5 py-1.5 flex flex-row sm:flex-col items-center justify-between sm:justify-center">
                                <span
                                    class="text-xs sm:text-[10px] font-bold uppercase tracking-wide text-gray-600 sm:mb-0.5">Kids</span>
                                <div class="flex items-center gap-2 lg:gap-1">
                                    <button type="button" onclick="updateCount('children', -1)"
                                        aria-label="Decrease kids"
                                        class="w-10 h-10 sm:w-9 sm:h-9 lg:w-6 lg:h-6 rounded-lg bg-white border border-gray-200 text-forest font-bold text-base lg:text-xs flex items-center justify-center hover:bg-forest hover:text-white transition cursor-pointer">−</button>
                                    <span id="childCount"
                                        class="w-6 lg:w-4 text-center text-base lg:text-xs font-bold text-charcoal tabular-nums">0</span>
                                    <button type="button" onclick="updateCount('children', 1)"
                                        aria-label="Increase kids"
                                        class="w-10 h-10 sm:w-9 sm:h-9 lg:w-6 lg:h-6 rounded-lg bg-white border border-gray-200 text-forest font-bold text-base lg:text-xs flex items-center justify-center hover:bg-forest hover:text-white transition cursor-pointer">+</button>
                                </div>
                            </div>

                            <!-- Rooms -->
                            <div
                                class="bg-sand/70 border border-gray-200 rounded-xl px-3 sm:px-1.5 py-1.5 flex flex-row sm:flex-col items-center justify-between sm:justify-center">
                                <span
                                    class="text-xs sm:text-[10px] font-bold uppercase tracking-wide text-gray-600 sm:mb-0.5">Rooms</span>
                                <div class="flex items-center gap-2 lg:gap-1">
                                    <button type="button" onclick="updateCount('rooms', -1)" aria-label="Decrease rooms"
                                        class="w-10 h-10 sm:w-9 sm:h-9 lg:w-6 lg:h-6 rounded-lg bg-white border border-gray-200 text-forest font-bold text-base lg:text-xs flex items-center justify-center hover:bg-forest hover:text-white transition cursor-pointer">−</button>
                                    <span id="roomCount"
                                        class="w-6 lg:w-4 text-center text-base lg:text-xs font-bold text-charcoal tabular-nums">1</span>
                                    <button type="button" onclick="updateCount('rooms', 1)" aria-label="Increase rooms"
                                        class="w-10 h-10 sm:w-9 sm:h-9 lg:w-6 lg:h-6 rounded-lg bg-white border border-gray-200 text-forest font-bold text-base lg:text-xs flex items-center justify-center hover:bg-forest hover:text-white transition cursor-pointer">+</button>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="guests" value="2 Adults, 1 Room" />
                    </div>

                    <!-- Live Estimate + WhatsApp CTA (2 cols on desktop) -->
                    <div class="sm:col-span-2 lg:col-span-2 flex flex-col justify-between">
                        <div class="flex items-baseline justify-between mb-1 px-0.5 gap-1">
                            <span id="nightsLabel" class="text-[11px] font-medium text-gray-500 truncate">1 Night • 1
                                Room</span>
                            <span id="totalPrice"
                                class="text-base font-bold text-forest tabular-nums shrink-0">₹4,999</span>
                        </div>
                        <button onclick="bookViaWhatsApp()"
                            class="w-full bg-forest hover:bg-forestLight text-white font-semibold text-xs xl:text-sm py-3 px-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-md cursor-pointer whitespace-nowrap">
                            <span id="bookingCtaText">Book via WhatsApp</span>
                            <span>→</span>
                        </button>
                        <p id="estimateNote" class="text-[11px] leading-snug text-gray-600 mt-1.5 px-0.5"></p>
                    </div>
                    <p id="capacityWarning" role="status" class="hidden sm:col-span-2 lg:col-span-12 text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2"></p>

                </div>
            </div>
        </div>
    </section>

    <div id="trustBar" class="bg-forest text-alabaster py-6 px-5 border-t border-white/10 flex flex-wrap justify-center gap-x-10 gap-y-5 text-xs md:text-sm"></div>

    <section id="stays" class="py-20 px-5 md:px-12 max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 reveal">
            <div>
                <span class="text-bronze font-semibold text-xs uppercase tracking-widest">Sanctuaries & Tariffs</span>
                <h2 class="font-serif text-4xl md:text-5xl font-semibold text-forest mt-2">Choose Your Stay</h2>
            </div>
            <a href="rooms.html" class="text-forest font-semibold text-sm underline underline-offset-4 hover:text-bronze transition mt-3 md:mt-0">Compare all rooms & amenities →</a>
        </div>
        <div id="stayCards" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        <div id="moreStays"></div>
    </section>

    <section id="story" class="py-20 px-5 md:px-12 bg-sand/60">
        <div id="storyContent" class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center"></div>
    </section>

    <section id="experiences" class="py-20 px-5 md:px-12 max-w-7xl mx-auto">
        <div id="experiencesContent"></div>
    </section>
    </main>

    <!-- MOBILE STICKY RATE BAR -->
    <div data-sticky-bar class="fixed bottom-0 left-0 right-0 z-40 md:hidden bg-white/95 backdrop-blur-lg border-t border-gray-200 px-4 py-3 flex items-center justify-between shadow-lg">
        <div>
            <span class="text-[11px] text-gray-500 block">Direct Tariff</span>
            <span class="text-base font-bold text-forest tabular-nums">From <span data-starting-price></span> <span class="text-xs font-normal text-gray-500">/ night</span></span>
        </div>
        <a href="#booking-dock" class="bg-bronze text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow">Check Dates</a>
    </div>

    <div id="site-footer"></div>
    <div id="site-floating"></div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
