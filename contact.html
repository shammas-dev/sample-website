<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-page="contact">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packages & Contact | Vana Mist Resort Wayanad</title>
    <meta name="description" content="Honeymoon and family packages, directions and direct reservations at Vana Mist Resort." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- STYLES (development mode: Tailwind CDN). For production run `npm run build:css`, then replace the
         next two <script> lines with:  <link rel="stylesheet" href="css/tailwind.css" /> -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Config + theme run here so colours are correct before first paint -->
    <script src="js/config.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/theme.js"></script>
</head>
<body class="bg-alabaster text-charcoal font-sans antialiased">

    <div id="site-header" data-variant="solid"></div>

    <section class="bg-forest text-alabaster py-16 px-5 md:px-12 text-center">
        <span data-cfg="pages.contact.eyebrow" class="text-gold text-xs font-bold uppercase tracking-widest"></span>
        <h1 data-cfg="pages.contact.heading" class="font-serif text-4xl md:text-6xl font-semibold mt-2"></h1>
    </section>

    <main id="main" class="max-w-7xl mx-auto py-16 px-5 md:px-12 space-y-20">

        <section>
            <h2 class="font-serif text-3xl md:text-4xl font-semibold text-forest mb-8">Seasonal & Honeymoon Packages</h2>
            <div id="packageGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
            <div class="space-y-6">
                <h2 class="font-serif text-3xl font-semibold text-forest">How to Reach Us</h2>
                <div class="rounded-3xl overflow-hidden shadow-sm border border-gray-200 h-72">
                    <iframe data-cfg-src="mapEmbedUrl" src="" title="Resort location map" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
                <div class="bg-sand/70 p-6 rounded-2xl text-sm space-y-2">
                    <p><strong>Address:</strong> <span data-cfg="address"></span></p>
                    <p><strong>Reservations Desk:</strong> <span data-cfg="phoneDisplay"></span> (<span data-cfg="contact.hours"></span>)</p>
                    <p><strong>Nearest Airport:</strong> <span data-cfg="contact.nearestAirport"></span></p>
                </div>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <h2 class="font-serif text-3xl font-semibold text-forest mb-2">Custom Group / Event Enquiry</h2>
                <p class="text-sm text-gray-500 mb-6">Planning a family gathering, corporate offsite, or custom stay? Send details directly to our reservations manager.</p>
                <form onsubmit="submitCustomEnquiry(event)" class="space-y-4">
                    <div>
                        <label for="enqName" class="block text-xs font-bold uppercase text-gray-500 mb-1">Your Name</label>
                        <input type="text" id="enqName" required placeholder="e.g. Rahul Menon" class="w-full bg-sand/60 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest" />
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="enqDates" class="block text-xs font-bold uppercase text-gray-500 mb-1">Preferred Month / Dates</label>
                            <input type="text" id="enqDates" required placeholder="e.g. Dec 20 - 22" class="w-full bg-sand/60 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest" />
                        </div>
                        <div>
                            <label for="enqGuests" class="block text-xs font-bold uppercase text-gray-500 mb-1">Total Guests</label>
                            <input type="text" id="enqGuests" required placeholder="e.g. 6 Adults, 2 Kids" class="w-full bg-sand/60 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest" />
                        </div>
                    </div>
                    <div>
                        <label for="enqNotes" class="block text-xs font-bold uppercase text-gray-500 mb-1">Special Requests</label>
                        <textarea id="enqNotes" rows="3" placeholder="Need campfire, extra beds, cab pickup..." class="w-full bg-sand/60 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-forest"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-bronze hover:bg-bronzeHover text-white font-semibold text-sm py-3.5 rounded-xl transition cursor-pointer shadow-md">Send Enquiry via WhatsApp →</button>
                </form>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <div id="site-floating"></div>

    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
