<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-page="policies">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policies & Privacy</title>
    <meta name="description" content="Booking, cancellation, house rules and privacy information." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- STYLES (development mode: Tailwind CDN). `npm run build` replaces these two lines with the compiled css/tailwind.css -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Config + theme run here so colours are correct before first paint -->
    <script src="js/config.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/theme.js"></script>
</head>

<body class="bg-alabaster text-charcoal font-sans antialiased">

    <div id="site-header" data-variant="solid"></div>

    <section class="bg-forest text-alabaster py-16 px-5 md:px-12 text-center">
        <span data-cfg="pages.policies.eyebrow" class="text-gold text-xs font-bold uppercase tracking-widest"></span>
        <h1 data-cfg="pages.policies.heading" class="font-serif text-4xl md:text-6xl font-semibold mt-2"></h1>
    </section>

    <main id="main" class="max-w-4xl mx-auto py-16 px-5 md:px-12">
        <div id="policyContent" class="space-y-6"></div>
    </main>

    <div id="site-footer"></div>
    <div id="site-floating"></div>

    <script src="js/components.js"></script>
    <script src="js/script.js"></script>

</html>
