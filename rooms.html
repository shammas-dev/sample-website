<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-page="rooms">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stays & Tariffs | Vana Mist Resort Wayanad</title>
    <meta name="description" content="Room types, direct tariffs and amenities at Vana Mist Resort, Wayanad." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- STYLES (development mode: Tailwind CDN). For production run `npm run build:css`, then replace the
         next two <script> lines with:  <link rel="stylesheet" href="css/tailwind.css" /> -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/tailwind-theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <!-- Config + theme run here so colours are correct before first paint -->
    <script src="js/config.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/theme.js"></script>
</head>
<body class="bg-alabaster text-charcoal font-sans antialiased">

    <div id="site-header" data-variant="solid"></div>

    <section class="bg-forest text-alabaster py-16 px-5 md:px-12 text-center">
        <span data-cfg="pages.rooms.eyebrow" class="text-gold text-xs font-bold uppercase tracking-widest"></span>
        <h1 data-cfg="pages.rooms.heading" class="font-serif text-4xl md:text-6xl font-semibold mt-2"></h1>
        <p data-cfg="pages.rooms.intro" class="text-white/75 text-sm md:text-base max-w-xl mx-auto mt-3"></p>
    </section>

    <main id="main" class="max-w-7xl mx-auto py-16 px-5 md:px-12 space-y-20">
        <div id="roomsList" class="space-y-20"></div>
        <section class="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-gray-100 reveal">
            <h2 class="font-serif text-3xl font-semibold text-forest mb-6">Compare Stays at a Glance</h2>
            <div id="compareTable" class="overflow-x-auto"></div>
        </section>
    </main>

    <div id="site-footer"></div>
    <div id="site-floating"></div>

    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
